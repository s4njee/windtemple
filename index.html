<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wind Temple</title>
    <!-- Inline, so no browser goes looking for /favicon.ico and logs a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2311141a'/%3E%3Crect x='3' y='2' width='1.4' height='13' rx='0.7' fill='%239aa5b2'/%3E%3Cpath d='M4.4 2.5Q8 1.5 10 3.5T14.5 4.5Q11 6 9.5 6.5T4.4 8Z' fill='%23c79bff'/%3E%3C/svg%3E"
    />
    <script>
      // Before first paint, so a stored theme never flashes the other one.
      try {
        const theme = localStorage.getItem('wd-theme');
        if (theme === 'light' || theme === 'auto') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
